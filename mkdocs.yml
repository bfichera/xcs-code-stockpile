site_name: xcs-code-stockpile
site_description: Correlation and diffraction analysis tools for the XCS hutch at LCLS
site_url: https://bfichera.github.io/xcs-code-stockpile/
repo_url: https://github.com/bfichera/xcs-code-stockpile
repo_name: bfichera/xcs-code-stockpile

nav:
  - Getting started: index.md
  - API reference:
      - Overview: reference/index.md
      - Data loading: reference/datahandler.md
      - Metadata: reference/metadata.md
      - Filtering: reference/filter.md
      - Correlations: reference/correlations.md
      - Diffraction: reference/diffraction.md
      - Diagnostics: reference/sanity.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 xcs-code-stockpile contributors
